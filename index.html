<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" href="/logo.svg" type="image/svg+xml" />
	<title>Tap Board</title>
	<script>
		(function () {
			const stored = localStorage.getItem('picocrank-theme')
			const preference = stored === 'light' || stored === 'dark' || stored === 'auto'
				? stored
				: 'auto'
			const theme = preference === 'auto'
				? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
				: preference
			document.documentElement.setAttribute('data-theme', theme)
		})()
	</script>
</head>
<body>
	<div id="app"></div>
	<script type="module" src="/resources/vue/main.js"></script>
</body>
</html>
