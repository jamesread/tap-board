# Marketing screenshots, captured by `make` in this directory against the
# throwaway preview server it starts. Game state comes from seed/fixtures.json
# via the setup scripts in scripts/.
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18400/
dir = .
width = 390
height = 844
script = scripts/light.py, scripts/prepare.py
post_script_sleep = 1
theme = light
manifest_project = Tap Board
manifest_base_url = https://raw.githubusercontent.com/jamesread/tap-board/master/var/marketing/screenshots/

# Desktop hero: sidebar + a rolled pair of dice.
[home]
url = two-dice
width = 1280
height = 800
script = scripts/light.py, scripts/prepare.py, scripts/roll.py
title = Tap Board on desktop
description = Every helper is one tap away in the sidebar, grouped into dice, scoring and utilities. Here two dice have just been rolled, with their total shown underneath.

# Phone-sized boards.
[two-dice]
url = two-dice
script = scripts/light.py, scripts/prepare.py, scripts/roll.py
title = Two dice
description = Tap anywhere on the screen to roll two dice; the total appears below, so nobody has to add them up.

[three-and-two]
url = three-and-two
script = scripts/light.py, scripts/prepare.py, scripts/roll.py
title = Three and two
description = Two separate panels roll three red dice and two black dice independently, for games with asymmetric attack and defence rolls.

[dice-pool]
url = dice-pool
script = scripts/light.py, scripts/prepare.py, scripts/roll.py
title = Dice pool
description = Roll six dice at once with a single tap and see the running total, handy for games that roll a big handful of dice.

[twenty-sided-die]
url = twenty-sided-die
script = scripts/light.py, scripts/prepare.py, scripts/roll.py
title = Twenty-sided die
description = A large d20 that rolls with one tap, for role-playing and other games that need more than six sides.

[counter]
url = counter
script = scripts/light.py, scripts/prepare.py, scripts/counter.py
title = Counter
description = A simple up/down counter with huge buttons, for tracking a shared value such as rounds, resources or a score track.

[score-pad]
url = score-pad
script = scripts/light.py, scripts/prepare.py, scripts/score_pad.py
title = Score pad
description = Keep running scores for up to eight named players; tap a name to rename it and hold the buttons to change scores quickly.

[life-counter]
url = life-counter
script = scripts/light.py, scripts/prepare.py, scripts/life_counter.py
title = Life counter
description = Track life totals for each player, starting at 20, with large buttons that are easy to hit mid-game.

[turn-timer]
url = turn-timer
script = scripts/light.py, scripts/prepare.py, scripts/turn_timer.py
title = Turn timer
description = Pick a preset countdown and start it to keep turns moving, without needing a separate timer app.

[coin-flip]
url = coin-flip
script = scripts/light.py, scripts/prepare.py, scripts/roll.py
title = Coin flip
description = Tap to flip a coin and settle any heads-or-tails decision at the table.

[first-player]
url = first-player
script = scripts/light.py, scripts/prepare.py, scripts/first_player.py
title = First player
description = Set how many people are playing and tap once to pick who goes first, fairly and without arguments.

# Dark variants last; the browser session (and localStorage) is shared.
[home-dark]
url = score-pad
width = 1280
height = 800
script = scripts/dark.py, scripts/prepare.py, scripts/score_pad.py
theme = dark
title = Dark mode on desktop
description = The score pad in dark mode, which is easier on the eyes in a dimly lit game room. Switch themes from the header.

[life-counter-dark]
url = life-counter
script = scripts/dark.py, scripts/prepare.py, scripts/life_counter.py
theme = dark
title = Dark mode on a phone
description = The life counter in dark mode on a phone, keeping the screen dim while still readable at arm's length.
